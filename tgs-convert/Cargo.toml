[package]
name = "tgs-convert"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Parallel TGS and Lottie JSON to transparent VP9 WebM converter"
build = "build.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.5"
flate2 = "1.1"
png = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rlottie = { version = "0.5.4", default-features = false, features = ["vendor-telegram"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.24"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Security_Credentials", "Foundation", "Foundation_Collections"] }

[profile.release]
codegen-units = 1
lto = "thin"

[patch.crates-io]
# rlottie 0.5.4 uses unix-only OsStr::as_bytes; patched for Windows x86 builds.
rlottie = { path = "vendor/rlottie" }

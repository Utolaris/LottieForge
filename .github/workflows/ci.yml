name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-x64:
    name: Build Windows x64 binary with zig
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install zig
        shell: bash
        run: |
          case "$(uname -m)" in
            arm64) zarch="aarch64" ;;
            x86_64) zarch="x86_64" ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL -o /tmp/zig.tar.xz "https://ziglang.org/download/0.16.0/zig-${zarch}-macos-0.16.0.tar.xz"
          mkdir -p /tmp/zig
          tar -xJf /tmp/zig.tar.xz -C /tmp/zig --strip-components=1
          echo "/tmp/zig" >> "$GITHUB_PATH"
          export PATH="/tmp/zig:$PATH"
          zig version

      - name: Install archiver fallback
        run: brew install mingw-w64

      - name: Cross-compile tgs-convert.exe
        run: zig build

      - name: Upload x64 binary
        uses: actions/upload-artifact@v4
        with:
          name: tgs-convert-x64
          path: tgs-convert/target/x86_64-pc-windows-gnu/release/tgs-convert.exe

  test-x64:
    name: Test Windows x64 binary on Windows
    runs-on: windows-latest
    needs: build-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tgs-convert-x64
          path: bin

      - name: Install ffmpeg (gyan.dev full build with libwebp)
        run: choco install ffmpeg-full -y --no-progress

      - name: Verify FFmpeg 9 full build with animated WebP encoder
        shell: pwsh
        run: |
          $versionLine = ffmpeg -version | Select-Object -First 1
          $version = [regex]::Match($versionLine, '^ffmpeg version (\d+)')
          if (-not $version.Success -or [int]$version.Groups[1].Value -ne 9) {
            throw "FFmpeg 9 (full build) is required; found: $versionLine"
          }
          $encoders = ffmpeg -hide_banner -encoders 2>&1
          if (-not ($encoders -match "libwebp_anim")) { throw "ffmpeg does not provide libwebp_anim" }

      - name: Create test TGS from Lottie fixture
        shell: pwsh
        run: |
          $json = Get-Content -Raw tests/fixtures/sample.lottie.json
          $stream = [System.IO.MemoryStream]::new()
          $gzip = [System.IO.Compression.GzipStream]::new($stream, [System.IO.Compression.CompressionMode]::Compress, $true)
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($json)
          $gzip.Write($bytes, 0, $bytes.Length)
          $gzip.Dispose()
          [System.IO.File]::WriteAllBytes("sample.tgs", $stream.ToArray())

      - name: Version check
        run: .\bin\tgs-convert.exe --version

      - name: Convert TGS to transparent WebM
        run: .\bin\tgs-convert.exe sample.tgs --output out.webm --fps 5 --quality 100 --threads 2

      - name: Verify WebM output
        shell: pwsh
        run: |
          if (-not (Test-Path out.webm)) { throw "out.webm was not created" }
          $size = (Get-Item out.webm).Length
          Write-Host "out.webm size=$size"
          if ($size -lt 1000) { throw "out.webm too small: $size" }

      - name: Convert TGS to ProRes 4444 MOV
        run: .\bin\tgs-convert.exe mov sample.tgs --output out.mov --fps 5 --quality 100 --threads 2

      - name: Verify MOV output
        shell: pwsh
        run: |
          if (-not (Test-Path out.mov)) { throw "out.mov was not created" }
          $size = (Get-Item out.mov).Length
          Write-Host "out.mov size=$size"
          if ($size -lt 1000) { throw "out.mov too small: $size" }

      - name: Convert TGS to animated WebP
        run: .\bin\tgs-convert.exe webp sample.tgs --output out.webp --fps 5 --quality 75 --threads 2

      - name: Verify WebP output
        shell: pwsh
        run: |
          if (-not (Test-Path out.webp)) { throw "out.webp was not created" }
          $size = (Get-Item out.webp).Length
          Write-Host "out.webp size=$size"
          if ($size -lt 1000) { throw "out.webp too small: $size" }

      - name: Convert TGS to animated GIF
        run: .\bin\tgs-convert.exe gif sample.tgs --output out.gif --fps 5 --quality 100 --threads 2

      - name: Verify GIF output
        shell: pwsh
        run: |
          if (-not (Test-Path out.gif)) { throw "out.gif was not created" }
          $size = (Get-Item out.gif).Length
          Write-Host "out.gif size=$size"
          if ($size -lt 1000) { throw "out.gif too small: $size" }
